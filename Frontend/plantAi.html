<!DOCTYPE html>
<html>
<head>
<title>project 1</title>
<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    direction: rtl;
    min-height: 100vh;
    padding-bottom: 80px;
}
.main-content {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}
h2 {
    color: #2c5530;
    margin-bottom: 30px;
    font-size: 24px;
}
input, button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}
button {
    background: linear-gradient(45deg, #4CAF50, #45a049);
    color: white;
    font-weight: bold;
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76,175,80,0.4);
}
video, img {
    max-width: 400px;
    max-height: 400px;
    margin: 20px auto;
    display: block;
    border: 3px solid #ddd;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
#result {
    margin-top: 30px;
    font-size: 18px;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align: right;
    line-height: 1.6;
    max-width: 600px;
    margin: 30px auto;
}
#result ul {
    text-align: right;
    padding-right: 20px;
}
</style>
</head>

<body>
<div class="main-content">
    <h2>ارفع أو التقط صورة للنبات ليتم تحليله</h2>

    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button onclick="startCamera()">تشغيل الكاميرا</button>
    <button onclick="captureImage()">التقاط الصورة</button>
    <br>

    <video id="camera" autoplay playsinline style="display:none;"></video>
    <img id="preview" style="display:none;">
    <div id="result"></div>
</div>

<script>
let stream = null;
const API_KEY = "ZWYkexXfRlpCjo9dCL9eojI2fLrBb4jbTiSt6ryXVdod46om3S";

document.getElementById('imageInput').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        showImage(event.target.result);
    };
    reader.readAsDataURL(file);
};


async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('camera').srcObject = stream;
        document.getElementById('camera').style.display = "block";
    } catch (err) {
        alert("خطأ في تشغيل الكاميرا");
    }
}


function captureImage() {
    const video = document.getElementById('camera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg');

    showImage(imageData);

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
}


function showImage(src) {
    document.getElementById('preview').src = src;
    document.getElementById('preview').style.display = "block";
    document.getElementById('camera').style.display = "none";
    analyzePlant(src);
}


async function analyzePlant(imageData) {
    const result = document.getElementById('result');
    result.innerHTML = "جاري التحليل...";

    try {
        const response = await fetch("https://api.plant.id/v2/identify", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Api-Key": API_KEY
            },
            body: JSON.stringify({
                images: [imageData],
                similar_images: false
            })
        });

        const data = await response.json();

        if (!data.suggestions || data.suggestions.length === 0) {
            result.innerHTML = "لم يتم التعرف على النبات";
            return;
        }

        const plant = data.suggestions[0];
        const probability = (plant.probability * 100).toFixed(1);

        if (probability < 20) {
            result.innerHTML = "<b style='color:red'>هذه الصورة ليست لنبات</b>";
            return;
        }

        const name = plant.plant_name;
        const description = await getWikiInfo(name);

        result.innerHTML = `
            <b>اسم النبات:</b> ${name}<br>
            <b>دقة التعرف:</b> ${probability}%<br><br>
            <b>الوصف:</b>
            ${description}
        `;
    } catch (error) {
        result.innerHTML = "حدث خطأ أثناء الاتصال";
    }
}


async function getWikiInfo(plantName) {
    try {
        let response = await fetch(
            `https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(plantName)}`
        );

        if (response.status === 200) {
            const data = await response.json();
            return formatText(data.extract);
        }

        response = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(plantName)}`
        );

        if (response.status === 200) {
            const data = await response.json();
            return formatText(data.extract);
        }
    } catch (e) {}

    return "<ul><li>لم يتم العثور على وصف للنبات</li></ul>";
}

function formatText(text) {
    if (!text) return "";

    const sentences = text.split(/[\.\!\؟]/).filter(s => s.trim().length > 10);
    let html = "<ul>";

    sentences.forEach(s => {
        html += `<li>${s.trim()}</li>`;
    });

    html += "</ul>";
    return html;
}
</script>
</body>
</html>
