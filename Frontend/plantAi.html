<html>
<head>
<title>project 1</title>
<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    direction: rtl;
    
    min-height: 100vh;
        padding-bottom: 80px; 

}



.main-content {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}

h2 {
    color: #2c5530;
    margin-bottom: 30px;
    font-size: 24px;
}

/* أزرار وإدخالات */
input, button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}

button {
    background: linear-gradient(45deg, #4CAF50, #45a049);
    color: white;
    font-weight: bold;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76,175,80,0.4);
}

video, img {
    max-width: 400px;
    max-height: 400px;
    margin: 20px auto;
    display: block;
    border: 3px solid #ddd;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}

#result {
    margin-top: 30px;
    font-size: 18px;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align: right;
    line-height: 1.6;
    max-width: 600px;
    margin: 30px auto;
}

#result ul {
    text-align: right;
    padding-right: 20px;
}




</style>


</head>
<body>


<div class="main-content">
    <h2>📷 ارفع أو التقط صورة للنبات ليتم تحليله</h2>
    
    <input type="file" id="imageInput" accept="image/*" onchange="showImage(event)">
    <br>
    <button onclick="startCamera()"> تشغيل الكاميرا</button>
    <button onclick="captureImage()"> التقاط الصورة</button>
    <br>
    
    <video id="camera" autoplay playsinline style="display:none;"></video>
    <img id="preview" src="" alt="لم يتم اختيار صورة بعد">
    <div id="result"></div>
</div>
</body>
</html>
<script>let videoStream;

    function showImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('camera').style.display = "none";
          analyzePlant(e.target.result);
        }
        reader.readAsDataURL(file);
      }
    }

    async function startCamera() {
      const video = document.getElementById('camera');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = videoStream;
        video.style.display = "block";
      } catch (err) {
        alert("تعذر الوصول إلى الكاميرا: " + err.message);
      }
    }

    function captureImage() {
      const video = document.getElementById('camera');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const imgData = canvas.toDataURL('image/jpeg');
      document.getElementById('preview').src = imgData;
      video.style.display = "none";

      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }

      analyzePlant(imgData);
    }

    function formatDescription(text) {
      const sentences = text.split(/[\.\؟\!]/).filter(s => s.trim().length > 0);
      let bulletList = "<ul>";
      sentences.forEach(sentence => {
        bulletList += `<li>${sentence.trim()}</li>`;
      });
      bulletList += "</ul>";
      return bulletList;
    }

    async function analyzePlant(imgData) {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = " جاري تحليل الصورة...";

      try {
        const response = await fetch("https://api.plant.id/v2/identify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Api-Key": "ZWYkexXfRlpCjo9dCL9eojI2fLrBb4jbTiSt6ryXVdod46om3S" // ضع مفتاحك هنا
          },
          body: JSON.stringify({
            images: [imgData],
            similar_images: false,
            health: true
          })
        });

        const data = await response.json();

        if (data.suggestions && data.suggestions.length > 0) {
          const plant = data.suggestions[0];
          const name = plant.plant_name;
          const probability = (plant.probability * 100).toFixed(2);

          let healthText = " لم يتم تحديد صحة النبات.";
          if (data.health_assessment && data.health_assessment.is_healthy_probability !== undefined) {
            const healthyProb = (data.health_assessment.is_healthy_probability * 100).toFixed(2);
            if (healthyProb > 70) {
              healthText = ` <b>الحالة:</b> النبات سليم ✔️ (${healthyProb}%)`;
            } else {
              const diseases = data.health_assessment.diseases;
              if (diseases && diseases.length > 0) {
                healthText = `
                   <b>الحالة:</b> النبات قد يكون مريض<br>
                   <b>المرض المحتمل:</b> ${diseases[0].name}<br>
                   <b>احتمال المرض:</b> ${(diseases[0].probability*100).toFixed(2)}%
                `;
              }
            }
          }

          resultDiv.innerHTML = `
             <b>الاسم العلمي:</b> ${name}<br>
             <b>دقة التحليل:</b> ${probability}%<br><br>
            ${healthText}
            <br><br> <b>الوصف العلمي:</b>
          `;

          const wikiDesc = await getWikiDescription(name);
          resultDiv.innerHTML += formatDescription(wikiDesc);

        } else {
          resultDiv.textContent = " لم يتم التعرف على النبات.";
        }

      } catch (err) {
        resultDiv.textContent = " حدث خطأ أثناء التحليل: " + err.message;
      }
    }

    async function getWikiDescription(query) {
      try {
        let res = await fetch(`https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        if (res.status === 200) {
          const data = await res.json();
          if (data.extract) return data.extract;
        }
        res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        if (res.status === 200) {
          const data = await res.json();
          if (data.extract) return data.extract;
        }
        return "لم يتم العثور على وصف لهذا النبات.";
      } catch (e) {
        return "حدث خطأ أثناء جلب الوصف العلمي.";
      }
    }</script>
