<!DOCTYPE html>
<html lang="en">

<head>
    <title>Plant Identification - MyPlant</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .main-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h2 {
            color: #2c5530;
            margin-bottom: 30px;
            font-size: 24px;
        }

        input,
        button {
            margin: 10px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        video,
        img {
            max-width: 400px;
            max-height: 400px;
            margin: 20px auto;
            display: block;
            border: 3px solid #ddd;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        #result {
            margin-top: 30px;
            font-size: 18px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: right;
            line-height: 1.6;
            max-width: 600px;
            margin: 30px auto;
        }

        #result ul {
            text-align: right;
            padding-right: 20px;
        }

        .history-section {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        .history-title {
            color: #2c5530;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .plant-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .plant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.3);
        }

        .plant-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: none;
            border-radius: 0;
            margin: 0;
        }

        .plant-card-info {
            padding: 15px;
            text-align: right;
        }

        .plant-card-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c5530;
            margin-bottom: 8px;
        }

        .plant-card-confidence {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .plant-card-date {
            font-size: 12px;
            color: #999;
        }

        .empty-history {
            text-align: center;
            color: #999;
            font-size: 18px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html"> MyPlant <i class="bi bi-leaf-fill text-success"></i></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html" data-translate="nav-home">Home</a></li>
                    <li class="nav-item ms-3">
                        <span class="nav-link" data-lang-toggle style="cursor: pointer;">
                            <i class="bi bi-globe"></i> AR | EN
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- History Section -->
    <div class="history-section">
        <h2 class="history-title" data-translate="history-title">Plant History</h2>
        <div id="historyContainer" class="history-grid"></div>
    </div>

    <div class="main-content">
        <h2 data-translate="ai-title">Upload or capture a plant image for analysis</h2>

        <input type="file" id="imageInput" accept="image/*">
        <br>
        <button onclick="startCamera()" data-translate="start-camera">Start Camera</button>
        <button onclick="captureImage()" data-translate="capture-image">Capture Image</button>
        <br>

        <video id="camera" autoplay playsinline style="display:none;"></video>
        <img id="preview" style="display:none;">
        <div id="result"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Translations + Language Switcher -->
    <script src="translations.js"></script>
    <script src="language.js"></script>

    <script>
        let stream = null;
        const API_KEY = "ZWYkexXfRlpCjo9dCL9eojI2fLrBb4jbTiSt6ryXVdod46om3S";

        // Load plant history when page loads
        window.addEventListener('DOMContentLoaded', loadPlantHistory);

        document.getElementById('imageInput').onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                showImage(event.target.result);
            };
            reader.readAsDataURL(file);
        };

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('camera').srcObject = stream;
                document.getElementById('camera').style.display = "block";
            } catch (err) {
                alert("خطأ في تشغيل الكاميرا");
            }
        }

        function captureImage() {
            const video = document.getElementById('camera');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg');

            showImage(imageData);

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function showImage(src) {
            document.getElementById('preview').src = src;
            document.getElementById('preview').style.display = "block";
            document.getElementById('camera').style.display = "none";
            analyzePlant(src);
        }

        async function analyzePlant(imageData) {
            const result = document.getElementById('result');
            result.innerHTML = "جاري التحليل...";

            try {
                const response = await fetch("http://localhost:3000/api/identify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        images: [imageData],
                        similar_images: false
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 429) {
                        result.innerHTML = `<b style='color:red'>${data.message || 'تم تجاوز الحد المسموح للاستخدام اليومي'}</b>`;
                    } else {
                        result.innerHTML = `<b style='color:red'>${data.message || 'حدث خطأ في الخادم'}</b>`;
                    }
                    return;
                }

                if (!data.suggestions || data.suggestions.length === 0) {
                    result.innerHTML = "لم يتم التعرف على النبات";
                    return;
                }

                const plant = data.suggestions[0];
                const probability = (plant.probability * 100).toFixed(1);

                if (probability < 20) {
                    result.innerHTML = "<b style='color:red'>هذه الصورة ليست لنبات</b>";
                    return;
                }

                const name = plant.plant_name;
                const description = await getWikiInfo(name);

                result.innerHTML = `
                    <b>اسم النبات:</b> ${name}<br>
                    <b>دقة التعرف:</b> ${probability}%<br><br>
                    <b>الوصف:</b>
                    ${description}
                `;

                // Save to backend
                try {
                    await fetch('http://localhost:3000/api/save-plant', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            plantName: name,
                            probability: probability,
                            description: description,
                            imageData: imageData
                        })
                    });
                } catch (err) {
                    console.error("Failed to save plant info", err);
                }

            } catch (error) {
                result.innerHTML = "حدث خطأ أثناء الاتصال";
            }
        }

        async function getWikiInfo(plantName) {
            try {
                let response = await fetch(
                    `https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(plantName)}`
                );

                if (response.status === 200) {
                    const data = await response.json();
                    return formatText(data.extract);
                }

                response = await fetch(
                    `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(plantName)}`
                );

                if (response.status === 200) {
                    const data = await response.json();
                    return formatText(data.extract);
                }
            } catch (e) { }

            return "<ul><li>لم يتم العثور على وصف للنبات</li></ul>";
        }

        function formatText(text) {
            if (!text) return "";

            const sentences = text.split(/[\.\!\؟]/).filter(s => s.trim().length > 10);
            let html = "<ul>";

            sentences.forEach(s => {
                html += `<li>${s.trim()}</li>`;
            });

            html += "</ul>";
            return html;
        }

        async function loadPlantHistory() {
            try {
                const response = await fetch('http://localhost:3000/api/user-plants', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.status === 401) {
                    document.getElementById('historyContainer').innerHTML =
                        '<div class="empty-history">يرجى تسجيل الدخول لعرض سجل النباتات</div>';
                    return;
                }

                const data = await response.json();
                displayPlantHistory(data.plants || []);
            } catch (error) {
                console.error('Failed to load plant history:', error);
                document.getElementById('historyContainer').innerHTML =
                    '<div class="empty-history">حدث خطأ في تحميل السجل</div>';
            }
        }

        function displayPlantHistory(plants) {
            const container = document.getElementById('historyContainer');

            if (!plants || plants.length === 0) {
                container.innerHTML = '<div class="empty-history">لا توجد نباتات محفوظة بعد</div>';
                return;
            }

            container.innerHTML = plants.map(plant => {
                const date = formatDate(plant.created_at);
                const confidence = plant.confidence_score ? parseFloat(plant.confidence_score).toFixed(1) : 'N/A';

                let description = '';
                try {
                    if (plant.raw_api_response) {
                        const rawData = typeof plant.raw_api_response === 'string'
                            ? JSON.parse(plant.raw_api_response)
                            : plant.raw_api_response;
                        description = rawData.description || '';
                    }
                } catch (e) {
                    console.error('Error parsing raw_api_response', e);
                }

                const shortDesc = description.length > 100
                    ? description.substring(0, 100) + '...'
                    : description;

                return `
                    <div class="plant-card" onclick="viewPlantDetails(${plant.id})">
                        <img src="http://localhost:3000${plant.image_path}" alt="${plant.plant_name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                        <div class="plant-card-info">
                            <div class="plant-card-name">${plant.plant_name || 'غير معروف'}</div>
                            <div class="plant-card-confidence">دقة التعرف: ${confidence}%</div>
                            <div class="plant-card-desc" style="font-size: 13px; color: #555; margin-bottom: 8px;">${shortDesc}</div>
                            <div class="plant-card-date">${date}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '';

            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };

            try {
                return date.toLocaleDateString('ar-EG', options);
            } catch (e) {
                return date.toLocaleDateString();
            }
        }

        function viewPlantDetails(plantId) {
            console.log('Viewing plant details for ID:', plantId);
        }
    </script>
</body>

</html>
